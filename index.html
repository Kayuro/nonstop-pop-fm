<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Non-Stop-Pop FM · En direct</title>
  <meta name="description" content="Radio Non-Stop-Pop FM en direct (projet de fan).">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <video class="bg" id="bgVideo" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1">
    <source src="https://217-160-249-212.sslip.io/background.mp4" type="video/mp4">
  </video>
  <div class="bg-shade"></div>

  <main class="player">
    <div class="logo">
      <img src="assets/logo.png" alt="Non-Stop-Pop FM" data-optional>
      <span class="fm">FM</span>
    </div>

    <p class="live"><span class="dot"></span>EN DIRECT · 100.7 FM</p>

    <div class="now" aria-live="polite">
      <span class="now-label">EN CE MOMENT</span>
      <strong class="now-title" id="nowTitle">Non-Stop-Pop FM</strong>
      <span class="now-artist" id="nowArtist">Appuie sur lecture</span>
    </div>

    <div class="controls">
      <button id="playBtn" class="play" type="button" aria-label="Lecture">
        <svg class="i-play" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
      </button>
      <label class="volume">
        <span>Volume</span>
        <input type="range" id="volume" min="0" max="100" step="1" value="80">
      </label>
    </div>

    <p class="status" id="status" role="status"></p>

    <div class="video" id="videoWrap" hidden><div id="ytPlayer"></div></div>
  </main>

  <footer>Projet de fan non officiel, sans lien avec Rockstar Games. Les marques appartiennent à leurs propriétaires.</footer>

  <script src="config.js?v=4"></script>
  <script src="script.js?v=4"></script>
</body>
</html>
